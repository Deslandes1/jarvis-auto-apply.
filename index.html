<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS Auto-Apply</title>
    <script src="https://smtpjs.com/v3/smtp.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: 'Montserrat', sans-serif;
            background: #0f172a;
            color: #fff;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* --- Sidebar Styles --- */
        .sidebar {
            width: 320px;
            background: #0b2a4a;
            border-right: 2px solid #d4af37;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .sidebar-header {
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid #1e293b;
            background: #071d33;
        }

        .sidebar-header h2 { color: #d4af37; font-size: 20px; font-weight: 800; }
        .sidebar-header p { font-size: 12px; color: #94a3b8; margin-top: 5px; }

        .email-list {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
        }

        .email-list::-webkit-scrollbar { width: 6px; }
        .email-list::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }

        .recruiter-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1e293b;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 10px;
            transition: 0.2s;
            border: 1px solid #334155;
        }

        .recruiter-item:hover { border-color: #d4af37; background: #0f172a; }
        .recruiter-email { font-size: 12px; color: #cbd5e1; word-break: break-all; margin-right: 10px; }

        .btn-add-email {
            background: #10b981;
            color: white;
            border: none;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            flex-shrink: 0;
            transition: 0.2s;
        }

        .btn-add-email:hover { background: #059669; }

        /* --- Main Content Styles --- */
        .main-content {
            flex: 1;
            overflow-y: auto;
            padding: 30px;
            display: flex;
            justify-content: center;
        }

        .form-container {
            background: #0f172a;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 800px;
            border: 1px solid #d4af37;
            height: fit-content;
        }

        h1 { color: #d4af37; text-align: center; margin-bottom: 5px; font-size: 28px; }
        p.subtitle { text-align: center; color: #94a3b8; margin-bottom: 25px; font-size: 14px; }

        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #e2e8f0; font-size: 14px; }
        
        input, textarea {
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            border: 1px solid #334155;
            background: #1e293b;
            color: #fff;
            font-family: 'Montserrat', sans-serif;
            font-size: 14px;
            line-height: 1.5;
        }
        
        textarea { resize: vertical; height: 280px; }

        /* File List Styles */
        .file-list {
            margin-top: 10px;
            background: #1e293b;
            border-radius: 8px;
            padding: 10px;
            border: 1px dashed #334155;
            display: none;
        }

        .file-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #0f172a;
            padding: 8px 12px;
            border-radius: 6px;
            margin-bottom: 5px;
            font-size: 12px;
            border: 1px solid #334155;
        }

        .file-item:last-child { margin-bottom: 0; }
        .file-name { color: #e2e8f0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-right: 10px; }
        .file-size { color: #64748b; font-size: 10px; margin-left: 5px; }
        
        .btn-remove-file {
            background: #ff4757;
            color: white;
            border: none;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            font-size: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .btn-submit {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #f0d369, #d4af37);
            color: #0b2a4a;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }

        .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(212,175,55,0.4); }
        .btn-submit:disabled { opacity: 0.5; cursor: wait; transform: none; }
        
        .message-box {
            padding: 14px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            text-align: center;
            font-weight: 600;
            display: none;
        }
        .message-box.success { background: rgba(74, 255, 122, 0.2); color: #4aff7a; border: 1px solid #4aff7a; display: block; }
        .message-box.error { background: rgba(255, 71, 87, 0.2); color: #ff4757; border: 1px solid #ff4757; display: block; }
        .hint { font-size: 12px; color: #64748b; margin-top: 4px; }

        /* Responsive for Mobile */
        @media (max-width: 900px) {
            body { flex-direction: column; overflow: auto; height: auto; }
            .sidebar { width: 100%; height: 250px; border-right: none; border-bottom: 2px solid #d4af37; }
            .main-content { padding: 15px; }
            .form-container { padding: 20px; }
        }
    </style>
</head>
<body>

    <!-- Sidebar with Recruiter Emails -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <h2>🎯 Recruiter List</h2>
            <p>Click "Add" to include in your send list</p>
        </div>
        <div class="email-list" id="emailList"></div>
    </aside>

    <!-- Main Application Form -->
    <main class="main-content">
        <div class="form-container">
            <h1>JARVIS Auto-Apply</h1>
            <p class="subtitle">Send your CV, Certificates, and Cover Letter instantly.</p>

            <div id="statusMessage" class="message-box"></div>

            <form id="applyForm">
                
                <div class="form-group">
                    <label>Your Email Address (Gmail)</label>
                    <input type="email" id="senderEmail" placeholder="youremail@gmail.com" required>
                </div>

                <div class="form-group">
                    <label>Your Gmail App Password</label>
                    <input type="password" id="senderPassword" placeholder="16-character App Password" required>
                    <div class="hint">Go to Google Account Security -> App Passwords to generate one.</div>
                </div>

                <div class="form-group">
                    <label>Target Emails</label>
                    <input type="text" id="targetEmails" placeholder="hr@company1.com, jobs@company2.com" required>
                </div>

                <div class="form-group">
                    <label>Email Subject</label>
                    <input type="text" id="emailSubject" value="Application for Remote Software Engineer - Gesner Deslandes" required>
                </div>

                <div class="form-group">
                    <label>Cover Letter</label>
                    <textarea id="emailBody" required>Dear Hiring Manager,

I am writing to express my strong interest in the Software Engineer position. As a highly motivated developer, I have built a vast portfolio of applications, games, and websites, all available on my GitHub profile. 

One of my proudest projects is the "G Jarvis Communication Portal." I developed this platform to connect my students for educational purposes. Because online safety is paramount, I built a secure, protected environment into the application—creating a "shield" in the code that allows students to interact safely without being exposed to the wider internet.

I am eager to bring my problem-solving skills and passion for secure software development to your team. Please find my CV and my certifications attached for your review.

Thank you for your time and consideration.

Sincerely,

Gesner Deslandes
Technology Coordinator / Software Developer
Be Like Brit - Grand Goâve, Haiti
Phone: (509) 4738-5663
Email: deslandes78@gmail.com
GitHub Portfolio: https://github.com/deslandes1</textarea>
                </div>

                <div class="form-group">
                    <label>Upload CV & Certificates</label>
                    <input type="file" id="cvFile" accept=".pdf, .doc, .docx, .png, .jpg, .jpeg" multiple>
                    <div class="hint" style="color:#f0d369;">💡 You can click this multiple times to add more files. They will stack below.</div>
                    
                    <!-- Visible list of uploaded files -->
                    <div id="fileList" class="file-list"></div>
                </div>

                <button type="submit" class="btn-submit" id="submitBtn">🚀 Send Applications</button>
            </form>
        </div>
    </main>

    <script>
        // 1. Populate the Recruiter Sidebar
        const recruiters = [
            "recruiting@techcorp.com", "hr@innovativedevs.io", "talent@globalsoft.com", 
            "jobs@remoteworks.tech", "careers@futurecode.org", "hiring@cloudscale.net", 
            "team@startupincubator.com", "hr@digitalfrontiers.com", "recruitment@aitechhub.com", 
            "jobs@webwizards.io", "talent@nexgenapps.com", "careers@datadrive.com", 
            "hiring@codecrafters.net", "hr@softwaredynamics.com", "recruiting@nextleveltech.org", 
            "jobs@devsforgood.com", "team@agileminds.io", "careers@bytebuilders.com", 
            "hr@techpioneers.com", "recruiting@globaldevs.net"
        ];

        const emailListDiv = document.getElementById('emailList');
        const targetEmailsInput = document.getElementById('targetEmails');

        recruiters.forEach(email => {
            const item = document.createElement('div');
            item.className = 'recruiter-item';
            item.innerHTML = `
                <span class="recruiter-email">${email}</span>
                <button class="btn-add-email" onclick="addEmail('${email}')">➕ Add</button>
            `;
            emailListDiv.appendChild(item);
        });

        function addEmail(email) {
            let currentEmails = targetEmailsInput.value.trim();
            if (currentEmails === '') {
                targetEmailsInput.value = email;
            } else {
                if (!currentEmails.includes(email)) {
                    targetEmailsInput.value = currentEmails + ', ' + email;
                }
            }
        }

        // 2. File Accumulation Logic
        const fileInput = document.getElementById('cvFile');
        const fileListDiv = document.getElementById('fileList');
        let allFiles = []; // Master list of all files added

        fileInput.addEventListener('change', function(e) {
            const newFiles = Array.from(e.target.files);
            
            newFiles.forEach(file => {
                // Check if file is already in the list (by name and size)
                const isDuplicate = allFiles.some(f => f.name === file.name && f.size === file.size);
                if (!isDuplicate) {
                    allFiles.push(file);
                }
            });

            // Reset input value so selecting the same file again triggers the event
            fileInput.value = '';
            renderFileList();
        });

        function renderFileList() {
            fileListDiv.innerHTML = '';
            
            if (allFiles.length === 0) {
                fileListDiv.style.display = 'none';
                return;
            }
            
            fileListDiv.style.display = 'block';

            allFiles.forEach((file, index) => {
                const sizeMB = (file.size / (1024 * 1024)).toFixed(2);
                const item = document.createElement('div');
                item.className = 'file-item';
                item.innerHTML = `
                    <div style="display:flex; align-items:center; overflow:hidden;">
                        <span class="file-name">📄 ${file.name}</span>
                        <span class="file-size">(${sizeMB} MB)</span>
                    </div>
                    <button type="button" class="btn-remove-file" onclick="removeFile(${index})">✕</button>
                `;
                fileListDiv.appendChild(item);
            });
            
            // Warning if total size exceeds 20MB
            const totalSize = allFiles.reduce((acc, f) => acc + f.size, 0);
            if (totalSize > 20 * 1024 * 1024) {
                const warning = document.createElement('div');
                warning.style.cssText = "color: #ff4757; font-size: 12px; font-weight: bold; margin-top: 8px;";
                warning.textContent = "⚠️ Warning: Total file size is over 20MB. Emails might fail to send.";
                fileListDiv.appendChild(warning);
            }
        }

        window.removeFile = function(index) {
            allFiles.splice(index, 1);
            renderFileList();
        };

        // 3. Handle Form Submission
        document.getElementById('applyForm').addEventListener('submit', function(e) {
            e.preventDefault(); 

            const btn = document.getElementById('submitBtn');
            const statusBox = document.getElementById('statusMessage');
            
            const senderEmail = document.getElementById('senderEmail').value.trim();
            const senderPassword = document.getElementById('senderPassword').value.trim();
            const targetEmailsStr = document.getElementById('targetEmails').value;
            const subject = document.getElementById('emailSubject').value;
            const body = document.getElementById('emailBody').value;

            if (allFiles.length === 0) return alert("Please upload your CV and Certificates.");
            
            const emails = targetEmailsStr.split(',').map(email => email.trim()).filter(email => email !== '');
            if (emails.length === 0) return alert("Please enter valid email addresses.");

            btn.disabled = true;
            btn.textContent = '⏳ Processing Files...';
            statusBox.className = 'message-box';
            statusBox.style.display = 'none';

            let attachments = [];
            let filesProcessed = 0;

            // Loop through our master allFiles array
            for (let i = 0; i < allFiles.length; i++) {
                const file = allFiles[i];
                const reader = new FileReader();
                
                reader.onload = function(event) {
                    const base64Data = event.target.result.split(',')[1];
                    attachments.push({
                        name: file.name,
                        data: base64Data
                    });
                    
                    filesProcessed++;
                    
                    if (filesProcessed === allFiles.length) {
                        btn.textContent = '⏳ Sending Emails...';
                        sendEmail(emails, senderEmail, senderPassword, subject, body, attachments, btn, statusBox);
                    }
                };
                
                reader.onerror = function() {
                    alert("Error reading file: " + file.name);
                    btn.disabled = false;
                    btn.textContent = '🚀 Send Applications';
                };
                
                reader.readAsDataURL(file);
            }
        });

        // 4. Send Email
        function sendEmail(emails, senderEmail, senderPassword, subject, body, attachments, btn, statusBox) {
            Email.send({
                Host: "smtp.gmail.com",
                Username: senderEmail,
                Password: senderPassword,
                To: emails.join(','), 
                From: senderEmail,
                Subject: subject,
                Body: body.replace(/\n/g, "<br>"),
                Attachments: attachments
            }).then(
                message => {
                    statusBox.textContent = "✅ Success! Your CV & " + attachments.length + " certificates were sent to " + emails.length + " recruiters.";
                    statusBox.className = 'message-box success';
                    btn.disabled = false;
                    btn.textContent = '🚀 Send Applications';
                    
                    // Clear files after successful send
                    allFiles = [];
                    renderFileList();
                }
            ).catch(err => {
                statusBox.textContent = "❌ Error: " + err + " (Check your App Password or Total File Size)";
                statusBox.className = 'message-box error';
                btn.disabled = false;
                btn.textContent = '🚀 Send Applications';
            });
        }
    </script>
</body>
</html>
